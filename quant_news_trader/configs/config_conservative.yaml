  lookback_days: 1000
  interval: "5m"

news:
  query: "US large cap stocks"
  language: "en"
  lookback_days: 7
  max_articles: 200

model:
  test_size: 0.2
  random_state: 42
  nn_epochs: 60
  batch_size: 128
  lr: 0.001

  # CONSERVATIVE: only trade on very high confidence
  long_thresh: 0.70     # need >= 70% P(up) to go long
  short_thresh: 0.75    # need >= 75% P(down) to short
  direction_horizon_days: 1

broker:
  initial_cash: 1000000
  commission_per_trade: 0.10
  slippage_bp: 1.0
  max_loss_fraction: 1.0

  # CONSERVATIVE: per-name cap 10%
  max_position_fraction: 0.10

logging:
  level: "INFO"

option_models:
  maturities_days: [5, 10, 20, 30, 60]
  risk_free_rate: 0.03
  min_confidence: 0.10
  merton:
    lambda_j: 0.5
    mu_j: -0.1
    delta_j: 0.2

moomoo:
  host: "127.0.0.1"
  port: 11111
  market: "US"
  security_firm: "FUTUSECURITIES"
  trd_market: "US"
  currency: "USD"
  paper_initial_cash: 1000000

live:
  interval_seconds: 60
  market: "US"
  timezone: "US/Eastern"
  use_moomoo: true

  # CONSERVATIVE: at most 30% of equity deployed
  max_total_fraction: 0.30

  rebalance_interval_minutes: 1
  daily_retrain_minutes_before_open: 30
